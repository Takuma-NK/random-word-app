<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ランダム単語生成アプリ</title>
</head>
<body>
  <h1>ランダム単語生成アプリ</h1>

  <label>
    テーマ：
    <input type="text" id="theme" value="未来">
  </label>

  <label>
    生成数：
    <input type="number" id="count" value="5">
  </label>

  <button onclick="sendData()">送信</button>

<hr>

<h2>単語追加</h2>

<label>
  テーマ：
  <input type="text" id="addTheme" value="未来">
</label>

<label>
  単語：
  <input type="text" id="addWord" value="空飛ぶ自動車">
</label>

<button onclick="addWord()">単語を追加</button>

<button onclick="getWords()">単語一覧を取得</button>

<h2>結果</h2>

<pre id="result"></pre>


  <script>
    async function sendData() {
      const theme = document.getElementById('theme').value;
      const count = Number(document.getElementById('count').value);

      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ theme: theme, count: count })
      });

      const data = await response.json();
      console.log(data);
    }
    async function addWord() {
      const theme = document.getElementById('addTheme').value;
      const word = document.getElementById('addWord').value;

      const response = await fetch('/api/words', {
        method: 'POST',
        headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      theme,
      word
    })
  });

      const data = await response.json();

      console.log(data);

      document.getElementById('result').textContent =
      JSON.stringify(data, null, 2);
}
    async function getWords() {
      const response = await fetch('/api/words');
      const data = await response.json();

    console.log(data);

    document.getElementById('result').textContent =
    JSON.stringify(data, null, 2);
}
  </script>
  
</body>
</html>
